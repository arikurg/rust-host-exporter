[package]
name = "exporter"
version = "0.1.0"
edition = "2021"
 
[dependencies]
clap = { version = "~4.4", features = ["derive"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
 
# Strip debug symbols from release builds for a smaller shipped binary.
[profile.release]
strip = true